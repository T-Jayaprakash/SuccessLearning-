<app-page-hero title="Study Materials & Resources" subtitle="Free tips, strategies, and guides to help you prepare better." [breadcrumbs]="[{label: 'Resources'}]"></app-page-hero>

<section class="section resources-page" id="resources-page">
  <div class="resources-page__container">
    <div class="resources-page__filters scroll-reveal">
      <button *ngFor="let cat of categories" class="resources-page__filter" [class.active]="activeFilter === cat" (click)="activeFilter = cat">{{ cat === 'all' ? 'All Topics' : cat }}</button>
    </div>
    <div class="resources-page__grid">
      <article *ngFor="let res of filteredResources; let i = index" class="resource-card scroll-reveal stagger-{{i+1}}" [id]="'resource-' + i">
        <div class="resource-card__icon"><i class="bi {{res.icon}}"></i></div>
        <div class="resource-card__content">
          <div class="resource-card__meta">
            <span class="resource-card__category">{{ res.category }}</span>
            <span class="resource-card__time"><i class="bi bi-clock"></i> {{ res.readTime }}</span>
          </div>
          <h3 class="resource-card__title">{{ res.title }}</h3>
          <p class="resource-card__desc">{{ res.description }}</p>
        </div>
      </article>
    </div>
  </div>
</section>

<app-cta-banner title="Want Personalised Guidance?" subtitle="Our trainers can create a study plan tailored to your needs."></app-cta-banner>
