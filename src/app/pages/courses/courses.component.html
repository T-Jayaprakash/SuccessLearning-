<app-page-hero
  title="Our Courses"
  subtitle="Comprehensive coaching programmes for international exams and foreign languages."
  [breadcrumbs]="[{label: 'Courses'}]">
</app-page-hero>

<section class="section courses-list" id="courses-list">
  <div class="courses-list__container">
    <!-- Search & Filter -->
    <div class="courses-list__toolbar scroll-reveal">
      <div class="courses-list__search">
        <i class="bi bi-search"></i>
        <input type="text" [(ngModel)]="searchQuery" placeholder="Search courses..." id="course-search">
      </div>
      <div class="courses-list__filters">
        <button *ngFor="let f of filters"
                class="courses-list__filter-btn"
                [class.active]="activeFilter === f.key"
                (click)="activeFilter = f.key"
                [id]="'filter-' + f.key">
          {{ f.label }}
        </button>
      </div>
    </div>

    <!-- Course Grid -->
    <div class="courses-list__grid">
      <a *ngFor="let course of filteredCourses; let i = index"
         [routerLink]="'/courses/' + course.slug"
         class="course-card-premium scroll-reveal stagger-{{i+1}}"
         [id]="'course-card-' + course.slug">
        <div class="course-card-premium__bg">
          <img [src]="course.image" [alt]="course.name" loading="lazy">
          <div class="course-card-premium__overlay"></div>
        </div>
        <div class="course-card-premium__content">
          <h3 class="course-card-premium__name">{{ course.name }}</h3>
          <p class="course-card-premium__desc">{{ course.description }}</p>
          <div class="course-card-premium__footer">
            <span class="course-card-premium__link" [style.color]="course.color">
              View Details <i class="bi bi-arrow-right"></i>
            </span>
          </div>
        </div>
      </a>
    </div>

    <div *ngIf="filteredCourses.length === 0" class="courses-list__empty">
      <i class="bi bi-search"></i>
      <p>No courses found matching your search.</p>
    </div>
  </div>
</section>

<app-cta-banner title="Not Sure Which Course?" subtitle="Talk to our team — we'll help you pick the right programme for your goals."></app-cta-banner>
